name: nightly

on:
  push:
    branches:
      - main

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      built_at: ${{ steps.metadata.outputs.built_at }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate nightly identity
        id: metadata
        env:
          REVISION: ${{ github.sha }}
        run: |
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 -m raptor.build_info nightly \
            "$REVISION" "$built_at" /tmp/raptor-build.json
          echo "built_at=${built_at}" >> "$GITHUB_OUTPUT"
      - name: Check installer syntax
        run: sh -n install.sh

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      channel: nightly
      revision: ${{ github.sha }}
      built_at: ${{ needs.prepare.outputs.built_at }}
      artifact_label: nightly

  publish:
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Publish rolling nightly
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          cd release
          sha256sum raptor-*.tar.gz > SHA256SUMS
          cp ../install.sh .
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly --clobber \
              raptor-*.tar.gz SHA256SUMS install.sh
            gh release edit nightly \
              --title "Nightly" \
              --prerelease \
              --notes "Latest successful build of main at ${REVISION}."
            gh api --method PATCH \
              "repos/${REPOSITORY}/git/refs/tags/nightly" \
              -f sha="$REVISION" \
              -F force=true
          else
            gh release create nightly \
              --target "$REVISION" \
              --title "Nightly" \
              --prerelease \
              --notes "Latest successful build of main at ${REVISION}." \
              raptor-*.tar.gz SHA256SUMS install.sh
          fi
