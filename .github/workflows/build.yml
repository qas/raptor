name: build

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      release_tag:
        required: false
        type: string
        default: ""
      revision:
        required: true
        type: string
      built_at:
        required: true
        type: string
      artifact_label:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            architecture: aarch64
          - runner: macos-15-intel
            target: macos-x86_64
            architecture: x86_64
          - runner: macos-15
            target: macos-arm64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --group release
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Generate build identity
        env:
          BUILD_CHANNEL: ${{ inputs.channel }}
          BUILD_REVISION: ${{ inputs.revision }}
          BUILD_TIMESTAMP: ${{ inputs.built_at }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$BUILD_CHANNEL" = "release" ]; then
            uv run python build_info.py release \
              "$BUILD_REVISION" "$BUILD_TIMESTAMP" .raptor-build.json \
              --tag "$RELEASE_TAG"
          else
            uv run python build_info.py nightly \
              "$BUILD_REVISION" "$BUILD_TIMESTAMP" .raptor-build.json
          fi
      - name: Run tests
        env:
          TG_BOT_TOKEN: test-token
          TG_USER_ID: "1"
          TG_CHAT_IDS: "1"
        run: uv run python -m unittest discover -s tests -p 'test_*.py'
      - name: Build release bundle
        run: uv run pyinstaller --noconfirm --clean raptor.spec
      - name: Smoke-test the binary
        env:
          AGENT_WORKDIR: ${{ runner.temp }}/raptor-smoke
          RAPTOR_HOME: ${{ runner.temp }}/raptor-smoke/.raptor
        run: |
          mkdir -p "$AGENT_WORKDIR"
          ./dist/raptor/raptor --help
          expected="$(uv run python -c \
            'from version import display_version; print(display_version())')"
          test "$(./dist/raptor/raptor --version)" = "raptor $expected"
          set +e
          ./dist/raptor/raptor --status
          status=$?
          set -e
          test "$status" -eq 1
          python3 - "$AGENT_WORKDIR" <<'PY'
          import json, os, subprocess, sys, tempfile
          workdir = sys.argv[1]
          binary = os.path.abspath("dist/raptor/raptor")
          liveness_read, liveness_write = os.pipe()
          start_read, start_write = os.pipe()
          ready_read, ready_write = os.pipe()
          policy_file = tempfile.TemporaryFile(mode="w+b")
          policy_file.write(json.dumps({
              "workspace": workdir,
              "patterns": [],
              "glob_scan_max_depth": 32,
          }).encode("utf-8"))
          policy_file.seek(0)
          process = subprocess.Popen(
              [binary, "_shell-supervisor", str(liveness_read),
               str(start_read), str(policy_file.fileno()), str(ready_write),
               "printf smoke"],
              cwd=workdir,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              pass_fds=(liveness_read, start_read, policy_file.fileno(),
                        ready_write),
          )
          policy_file.close()
          os.close(liveness_read)
          os.close(start_read)
          os.close(ready_write)
          os.write(start_write, b"1")
          os.close(start_write)
          if os.read(ready_read, 1) != b"1":
              raise SystemExit("shell supervisor did not signal readiness")
          os.close(ready_read)
          stdout, stderr = process.communicate(timeout=10)
          os.close(liveness_write)
          if process.returncode != 0:
              raise SystemExit(stderr.decode() or str(process.returncode))
          if stdout != b"smoke":
              raise SystemExit(repr(stdout))
          PY
      - name: Archive the onedir bundle
        env:
          ARTIFACT_LABEL: ${{ inputs.artifact_label }}
          TARGET: ${{ matrix.target }}
        run: |
          archive="raptor-${ARTIFACT_LABEL}-${TARGET}.tar.gz"
          tar -czf "$archive" -C dist raptor
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"
      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
