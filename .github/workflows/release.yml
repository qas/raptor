name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      built_at: ${{ steps.metadata.outputs.built_at }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate human-selected release
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 -m raptor.build_info release \
            "$REVISION" "$built_at" /tmp/raptor-build.json \
            --tag "$RELEASE_TAG"
          echo "built_at=${built_at}" >> "$GITHUB_OUTPUT"
          case "$RELEASE_TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Check installer syntax
        run: sh -n install.sh

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      channel: release
      release_tag: ${{ github.ref_name }}
      revision: ${{ github.sha }}
      built_at: ${{ needs.prepare.outputs.built_at }}
      artifact_label: ${{ github.ref_name }}

  publish:
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Checksum and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum raptor-*.tar.gz > SHA256SUMS
          cp ../install.sh .
          release_kind=
          if [ "$PRERELEASE" = "true" ]; then
            release_kind=--prerelease
          fi
          gh release create "$TAG" \
            --draft \
            $release_kind \
            --title "$TAG" \
            --generate-notes \
            raptor-*.tar.gz \
            SHA256SUMS \
            install.sh
          gh release edit "$TAG" --draft=false
